name: Release

# Run by hand from the Actions tab. It checks the repository, then deploys the
# website and publishes the CLI, each only if its box is ticked.
on:
  workflow_dispatch:
    inputs:
      website:
        description: Deploy the website to invoices.vicente.fyi
        type: boolean
        default: true
      cli:
        description: Publish invoices-cli to npm as latest
        type: boolean
        default: true

# One release at a time, and never cancel one that is half way through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  website:
    name: Deploy website
    needs: check
    if: inputs.website
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://invoices.vicente.fyi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Alchemy builds the app with Vite and updates the `prod` stage on Cloudflare.
      # `--yes` approves the plan it prints, since nobody is there to answer a prompt.
      - name: Deploy
        working-directory: apps/web
        run: bunx alchemy deploy --stage prod --no-input --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cli:
    name: Publish CLI
    needs: check
    if: inputs.cli
    runs-on: ubuntu-latest
    # The same environment as the website, so a publish waits for the same approval.
    environment: production
    permissions:
      contents: read
      # npm trusted publishing: the job proves who it is with a short-lived
      # OIDC token, so there is no npm token stored in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/cli
        run: bun run build
      # The version to publish is the one in apps/cli/package.json. A version
      # that is already on npm is left alone, so the workflow can be re-run
      # to redeploy the website without failing here.
      - name: Publish
        working-directory: apps/cli
        run: |
          version=$(node --print "require('./package.json').version")
          if npm view "invoices-cli@$version" version > /dev/null 2>&1; then
            echo "invoices-cli@$version is already on npm; skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --tag latest
            echo "Published invoices-cli@$version as latest." >> "$GITHUB_STEP_SUMMARY"
          fi
